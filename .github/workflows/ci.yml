name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Unit-Tests (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev
      - name: Bauen und testen
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware STM32F746G-DISCO (Stufen 6-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi
      - name: Ausbaustufen bauen (L6 = Gegenprobe, L7..L12 = Fehlersuche, L12 = komplette Anwendung)
        run: |
          mkdir -p out
          for L in 6 7 8 9 10 11 12; do
            cmake -S . -B build-L$L -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
                  -DHD_BUILD_SIM=OFF -DHD_BUILD_TESTS=OFF -DHD_BUILD_STM32=ON -DCMAKE_BUILD_TYPE=Release \
                  -DHD_BOOT_LEVEL=$L -DCUBE_DIR=$PWD/cube -DFETCHCONTENT_BASE_DIR=$PWD/_deps
            cmake --build build-L$L -j --target hd_firmware
            cp build-L$L/hd_firmware.bin out/hd_firmware_L$L.bin
          done
          cp out/hd_firmware_L12.bin out/hd_firmware.bin
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: hd_firmware
          path: out/*.bin
          if-no-files-found: error
